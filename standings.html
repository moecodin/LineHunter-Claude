<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Theme: applied before anything renders, so there's no flash (default dark; js/components/nav.js has the toggle) -->
  <script>try { document.documentElement.setAttribute("data-bs-theme", localStorage.getItem("lh-theme") === "light" ? "light" : "dark"); } catch (error) { document.documentElement.setAttribute("data-bs-theme", "dark"); }</script>
  <meta name="robots" content="noindex"><!-- private soft launch: delete for the public launch -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Standings · LineHunter</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/lh-mark.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/lh-mark-32.png">
  <link rel="apple-touch-icon" href="assets/img/lh-mark-180.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <!-- Research mode: applied before anything renders, so there's no flash (js/components/nav.js has the switch) -->
  <script>try { if (localStorage.getItem("lh-mode") === "research") document.body.classList.add("research-mode"); } catch (error) { /* storage blocked: lines mode */ }</script>

  <div id="site-nav"></div>

  <main class="container-fluid lh-container px-3 px-lg-4 my-4">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
      <div>
        <h1 class="lh-top-title mb-1"><i class="bi bi-trophy-fill" aria-hidden="true"></i><span>Standings</span></h1>
        <div class="small text-muted">NBA · <span id="standingsSeason">Loading…</span></div>
      </div>
      <!-- Conference (default) / Division -->
      <div class="lh-window-toggle btn-group" id="standingsView" role="group" aria-label="View"></div>
    </div>

    <div id="standingsBody" class="mb-5" aria-busy="true">
      <div class="row g-4 g-xl-5 placeholder-glow" aria-hidden="true">
        <div class="col-12 col-lg-6"><span class="placeholder col-12 rounded" style="height: 22rem"></span></div>
        <div class="col-12 col-lg-6"><span class="placeholder col-12 rounded" style="height: 22rem"></span></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/hunts.js"></script>
  <script src="js/components/nav.js"></script>
  <script src="js/components/hunt-button.js"></script>
  <script src="js/components/my-hunts.js"></script>
  <script src="js/core/stats.js"></script>
  <script src="js/pages/standings.js"></script>
</body>
</html>
