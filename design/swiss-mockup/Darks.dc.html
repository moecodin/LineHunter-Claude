<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dark theme options</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
.n{font-variant-numeric:tabular-nums lining-nums}
</style>
</helmet>
<div style="width:1440px;box-sizing:border-box;padding:56px 80px 80px;background:#F2EBDD;color:#052350;font-family:'Inter Tight',Helvetica,Arial,sans-serif">
<div style="display:flex;align-items:baseline;gap:24px;border-top:1px solid #052350;padding-top:14px;margin-bottom:32px">
<h1 style="margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em">Dark theme options</h1>
<span style="font-size:13px;color:#4a5878">Ground · ink · accent</span>
</div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px">
<sc-for list="{{opts}}" as="c" hint-placeholder-count="6">
<div style="background:{{c.bg}};color:{{c.ink}};padding:24px 24px 20px;display:flex;flex-direction:column">
<div style="display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid {{c.ink}};padding-top:8px">
<span class="n" style="font-size:13px;font-weight:700">{{c.n}} {{c.name}}</span>
<span class="n" style="font-size:11px;font-weight:500;color:{{c.mute}}">{{c.hex}}</span>
</div>
<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:28px">
<div style="font-size:44px;line-height:.85;font-weight:700;letter-spacing:-.045em">Mikal<br>Bridges</div>
<div class="n" style="font-size:96px;line-height:.75;font-weight:300;letter-spacing:-.06em;color:#F0997B">72</div>
</div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;border-top:1px solid {{c.hair}};margin-top:22px;padding-top:10px">
<div><div style="font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:{{c.mute}}">Pick</div><div class="n" style="font-size:18px;font-weight:600;margin-top:2px">U 11.5</div></div>
<div><div style="font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:{{c.mute}}">Chance</div><div class="n" style="font-size:18px;margin-top:2px">71.6%</div></div>
<div><div style="font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:{{c.mute}}">L10</div><div class="n" style="font-size:18px;margin-top:2px">7–3</div></div>
</div>
<div style="display:flex;align-items:flex-end;gap:5px;height:56px;margin-top:16px;border-bottom:1px solid {{c.ink}};position:relative">
<span style="flex:1;height:45%;background:#D85A30"></span><span style="flex:1;height:79%;background:#1D9E75"></span><span style="flex:1;height:51%;background:#D85A30"></span><span style="flex:1;height:62%;background:#D85A30"></span><span style="flex:1;height:40%;background:#D85A30"></span><span style="flex:1;height:73%;background:#1D9E75"></span><span style="flex:1;height:56%;background:#D85A30"></span><span style="flex:1;height:68%;background:#1D9E75"></span><span style="flex:1;height:34%;background:#D85A30"></span><span style="flex:1;height:56%;background:#D85A30"></span>
<span style="position:absolute;left:0;right:0;bottom:65%;border-top:1px solid {{c.ink}}"></span>
</div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px">
<span style="font-size:11px;font-weight:600"><span style="color:#5DCAA5">Over 3</span>&#160;&#160;<span style="color:#F0997B">Under 7</span></span>
<span style="font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;background:{{c.btn}};color:{{c.btnInk}}">Add to My Hunts +</span>
</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1060}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [
      ['01','Black · pale blue (now)','#000000 · #D2E0F8','#000000','#D2E0F8','#8592AD','#1A2233','#D2E0F8','#000000'],
      ['02','Black · bone','#000000 · #F2EBDD','#000000','#F2EBDD','#9A9284','#26231E','#F2EBDD','#000000'],
      ['03','Warm black · bone','#100F0D · #F2EBDD','#100F0D','#F2EBDD','#9A9284','#2A2721','#F2EBDD','#100F0D'],
      ['04','Black · bone · cobalt','#000000 · #F2EBDD · #4D6BFF','#000000','#F2EBDD','#9A9284','#26231E','#4D6BFF','#FFFFFF'],
      ['05','Ink navy · pale blue','#060B18 · #D2E0F8','#060B18','#D2E0F8','#8592AD','#18213A','#D2E0F8','#060B18'],
      ['06','Graphite · bone · royal','#141414 · #F2EBDD · #5B4BFF','#141414','#F2EBDD','#9A9284','#2C2C2C','#5B4BFF','#FFFFFF']
    ];
    return { opts: list.map(([n,name,hex,bg,ink,mute,hair,btn,btnInk]) => ({n,name,hex,bg,ink,mute,hair,btn,btnInk})) };
  }
}
</script>
</body>
</html>
