<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex"><!-- private soft launch: delete for the public launch -->
  <title>LineHunter - Hit Rate Test</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/lh-mark.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/lh-mark-32.png">
  <link rel="apple-touch-icon" href="assets/img/lh-mark-180.png">
  <link href="https://api.fontshare.com/v2/css?f[]=technor@400,600,700&display=swap" rel="stylesheet">
</head>
<body>
  <p>Open the browser console (F12, then the Console tab) to see the results.</p>

  <script src="js/stats.js"></script>
  <script>
    // Test player: Jalen Brunson (player id 73 in BALLDONTLIE).
    const TEST_PLAYER_ID = 73;

    async function runHitRateTest() {
      const games = await fetchPlayerGameLogs(TEST_PLAYER_ID);
      console.log(`Downloaded ${games.length} games (newest first). Newest:`, games[0].game.date);

      // Same games, a few different questions.
      const checks = [
        { stat: "pts", line: 26.5, windowSize: 10 },
        { stat: "ast", line: 6.5, windowSize: 5 },
        { stat: "pts+reb+ast", line: 35.5, windowSize: "all" },
      ];

      const results = checks.map(({ stat, line, windowSize }) => {
        const result = calculateHitRate(games, stat, line, windowSize);
        console.log(`${stat} over ${line}, window ${windowSize}: ` +
          `${result.hits}/${result.totalGames} = ${result.hitRate}% (avg ${result.average})`);
        console.table(result.games); // shows the game list as a neat table
        return { stat, line, windowSize, ...result };
      });

      return { gamesDownloaded: games.length, results };
    }

    runHitRateTest().catch((error) => console.error("Hit rate test failed:", error));
  </script>
</body>
</html>
