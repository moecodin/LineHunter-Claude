<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Theme: applied before anything renders, so there's no flash (default dark; js/components/nav.js has the toggle) -->
  <script>try { document.documentElement.setAttribute("data-bs-theme", localStorage.getItem("lh-theme") === "light" ? "light" : "dark"); } catch (error) { document.documentElement.setAttribute("data-bs-theme", "dark"); }</script>
  <meta name="robots" content="noindex"><!-- private soft launch: delete for the public launch -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Game · LineHunter</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/lh-mark.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/lh-mark-32.png">
  <link rel="apple-touch-icon" href="assets/img/lh-mark-180.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="css/styles.css" rel="stylesheet">
</head>

<body>
  <!-- Research mode: applied before anything renders, so there's no flash (js/components/nav.js has the switch) -->
  <script>try { if (localStorage.getItem("lh-mode") === "research") document.body.classList.add("research-mode"); } catch (error) { /* storage blocked: lines mode */ }</script>

  <div id="site-nav"></div>

  <main class="container-fluid lh-container px-3 px-lg-4">

    <!-- BACK BUTTON: btn-ghost = our quiet outlined pill button (css/styles.css) -->
    <a href="schedule.html" class="btn btn-sm btn-ghost mb-3">‹ All games</a>

        <!-- MATCHUP CARD (left, col-lg-6), MATCHUP INFO (col-lg-3) and INJURY REPORT (col-lg-3), same height. Stacked on phones, header first. -->
    <div class="row g-4 mb-4">
      <div class="col-lg-6">
        <div id="game-header" class="card matchup-hero h-100">
          <div class="card-body text-center text-muted py-5">Loading game...</div>
        </div>
      </div>
      <div class="col-md-6 col-lg-3">
        <!-- MATCHUP INFO: arena, coaches, last 5, home / road record, rest, last meeting. js/components/matchupInfo.js fills it in. -->
        <div id="matchup-info" class="card lh-tint-card h-100">
          <div id="matchup-info-body" class="flex-grow-1">
            <div class="card-body text-center text-muted py-5">Loading matchup info...</div>
          </div>
        </div>
      </div>
      <div class="col-md-6 col-lg-3">
        <!-- INJURY REPORT: both teams, same look as the player page's card. js/components/gameInjuries.js fills it in. -->
        <div class="card lh-tint-card lh-injury-card h-100">
          <div class="card-header py-3"><div class="lh-label">Injury report</div></div>
          <div id="gameInjuryList" class="lh-injury-list lh-game-injury-list">
            <div class="text-muted small p-3">Loading…</div>
          </div>
        </div>
      </div>
    </div>

    <!-- PLAYER PROPS CARD -->
    <div class="card lh-tint-card mb-4" id="gamePropsCard">
      <div class="card-header lh-label py-3"><span class="lines-only">Player Props</span><span class="research-only">Player Stats</span></div>
      <div class="card-body">

        <!-- RESEARCH MODE: the stat tabs and window toggle of the "Player Stats" table. js/pages/game.js adds the buttons. -->
        <ul id="prop-pills" class="nav nav-underline lh-tabs mb-3 research-only"></ul>
        <div class="d-flex flex-wrap align-items-center gap-2 mb-3 research-only">
          <div id="table-windows" class="btn-group btn-group-sm lh-window-toggle" role="group" aria-label="How many games to use"></div>
          <span id="table-window-note" class="small text-muted" hidden>This season hasn't started, so Season shows last season.</span>
        </div>

        <!-- LINES MODE: the same controls as Top Hit Rates (L5 / L10 / L20, Filter, Sportsbook, search, chips: js/components/prop-list.js inserts them
             right above these tabs), then the stat tabs ALL / PTS / REB / AST / 3PM / PRA and the rows. -->
        <ul id="propTabs" class="nav nav-underline lh-tabs mb-3 lines-only"></ul>

        <!-- Shown when the books haven't posted lines for this game or this prop yet (players are still listed) -->
        <div id="lines-note" class="small text-muted mb-3 lines-only" hidden></div>

        <!-- Messages like "Loading..." or "No lines yet" appear here -->
        <div id="lines-message" class="text-muted">Loading lines...</div>

        <!-- Lines mode: plain rows (player, prop line, hit count, graph, stepper, Over / Under, odds, + Add). Rows past the first 8 sit in a collapse. -->
        <div id="propList" class="lines-only d-none">
          <div id="propRows" class="lh-prows"></div>
          <div id="propRowsMore" class="collapse lh-prows"></div>
          <button type="button" id="propsToggle" class="btn btn-sm btn-outline-secondary lh-mi-toggle w-100 mt-3 collapsed" hidden
                  data-bs-toggle="collapse" data-bs-target="#propRowsMore" aria-expanded="false" aria-controls="propRowsMore">
            <span id="propsToggleText">Show all</span> <i class="bi bi-chevron-down lh-mi-chevron" aria-hidden="true"></i>
          </button>
        </div>

        <!-- Research mode: the "Player Stats" table (Player, Avg, graph, "25+ in 7/10") -->
        <div id="lines-table" class="table-responsive d-none research-only">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>Player</th>
                <th class="text-end" data-sort="average">
                  <button type="button" class="lh-sort-button">Avg <i class="bi bi-caret-down-fill"></i></button>
                </th>
                <th class="d-none d-md-table-cell">Graph vs milestone</th>
                <th class="text-end">Milestone</th>
              </tr>
            </thead>
            <tbody id="lines-body"></tbody>
            <!-- Rows 6 and up: hidden until "Show all players" (Bootstrap collapse on the table body) -->
            <tbody id="lines-more" class="collapse"></tbody>
          </table>
        </div>

        <!-- Full-width button under the research table; js/pages/game.js shows it only when there are more than 5 players -->
        <button type="button" id="linesToggle" class="btn btn-sm btn-outline-secondary lh-mi-toggle w-100 mt-3 collapsed research-only" hidden
                data-bs-toggle="collapse" data-bs-target="#lines-more" aria-expanded="false" aria-controls="lines-more">
          <span id="linesToggleText">Show all players</span> <i class="bi bi-chevron-down lh-mi-chevron" aria-hidden="true"></i>
        </button>

      </div>
    </div>

    <!-- MATCHUP DETAILS: the team comparison (butterfly bars), full width, always visible. js/components/teamCompare.js loads its data
         when this card scrolls into view. -->
    <div class="card lh-tint-card mb-5" id="matchupDetails">
      <div class="card-header lh-label py-3">Matchup Details</div>
      <div class="card-body" id="teamCompareBody"></div>
    </div>

  </main>

  <!-- PLAYER DRAWER: Bootstrap offcanvas that slides in from the right (offcanvas-end).
       js/components/player-drawer.js fills it in when a row in the props table is clicked. -->
  <div class="offcanvas offcanvas-end lh-player-drawer" tabindex="-1" id="playerDrawer" aria-labelledby="playerDrawerName">
    <div class="offcanvas-header align-items-start">
      <div>
        <h2 class="lh-display h3 mb-1" id="playerDrawerName">Player</h2>
        <div class="lh-label" id="playerDrawerMeta"></div>
        <!-- js/components/player-drawer.js sets the link: player.html?id=PLAYER_ID&prop=pts -->
        <div class="d-flex flex-wrap gap-2 mt-2">
          <a id="playerDrawerPageLink" class="btn btn-sm lh-player-page-btn" href="player.html">Go to player page →</a>
          <!-- Share the chart as a picture (js/components/share.js) -->
          <button type="button" id="playerDrawerShare" class="btn btn-sm btn-ghost lines-only" aria-label="Share this chart as an image" title="Share as image">
            <i class="bi bi-share" aria-hidden="true"></i> Share
          </button>
        </div>
      </div>
      <button type="button" class="lh-drawer-close ms-auto" data-bs-dismiss="offcanvas" aria-label="Close">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="offcanvas-body">
      <!-- PROP TOOLBAR (lines mode): stat tabs, the line stepper, Over / Under, the best odds and "Add to My Hunts".
           js/components/prop-toolbar.js builds it and moves the stat tabs in; in research mode the tabs stay below. -->
      <div id="playerDrawerToolbar"></div>
      <!-- Research mode: "25+ PTS in 7 of last 10 · avg 24.3" -->
      <div id="playerDrawerMilestone" class="research-only mb-3"></div>

      <!-- Stat tabs: Points, Rebounds, Assists, 3PM, P+R+A -->
      <ul id="playerDrawerStats" class="nav nav-underline lh-tabs mb-3"></ul>

      <!-- Window toggle: L5 / L10 / L20 / Season -->
      <div class="d-flex flex-wrap gap-2 mb-3">
          <div id="playerDrawerWindows" class="btn-group btn-group-sm lh-window-toggle" role="group" aria-label="How many games to show"></div>
          <div id="playerDrawerSplits" class="btn-group btn-group-sm lh-window-toggle" role="group" aria-label="All, home, away or head-to-head games"></div>
        </div>

      <!-- Hit rate and average -->
      <div id="playerDrawerSummary" class="d-flex gap-4 mb-3"></div>

      <!-- The chart, its hover tooltip, and the alt line − / + control: built by js/components/propChart.js -->
      <div id="playerDrawerChart"></div>

      <div id="playerDrawerMessage" class="text-muted small mt-2" hidden></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Chart.js draws the bar chart in the player drawer -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"
          integrity="sha384-bs/nf9FbdNouRbMiFcrcZfLXYPKiPaGVGplVbv7dLGECccEXDW+S3zjqSKR5ZEaD"
          crossorigin="anonymous"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/hunts.js"></script>
  <script src="js/components/nav.js"></script>
  <script src="js/components/hunt-button.js"></script>
  <script src="js/components/my-hunts.js"></script>
  <script src="js/data/odds.js"></script>
  <script src="js/core/stats.js"></script>
  <script src="js/core/h2h.js"></script>
  <script src="js/components/propChart.js"></script>
  <script src="js/components/prop-toolbar.js"></script>
  <script src="js/components/prop-list.js"></script>
  <script src="js/components/share.js"></script>
  <script src="js/data/teams.js"></script>
  <script src="js/components/matchupInfo.js"></script>
  <script src="js/components/gameInjuries.js"></script>
  <script src="js/components/teamCompare.js"></script>
  <script src="js/pages/game.js"></script>
  <script src="js/components/player-drawer.js"></script>
</body>
</html>
