<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game · LineHunter</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="styles.css" rel="stylesheet">
</head>

<body>

  <div id="site-nav"></div>

  <main class="container">

    <!-- BACK BUTTON: btn-ghost = our quiet outlined pill button (styles.css) -->
    <a href="schedule.html" class="btn btn-sm btn-ghost mb-3">‹ All games</a>

    <!-- MATCHUP CARD: matchup-hero = the violet gradient (styles.css). game.js fills it in. -->
    <div id="game-header" class="card matchup-hero mb-4">
      <div class="card-body text-center text-muted py-5">Loading game...</div>
    </div>

    <!-- PLAYER PROPS CARD -->
    <div class="card mb-5">
      <div class="card-header lh-label py-3">Player Props</div>
      <div class="card-body">

        <!-- PROP TYPE PILLS: Bootstrap "nav-pills". game.js adds one button per prop type.
             flex-nowrap + overflow-auto = one row that scrolls sideways on phones -->
        <ul id="prop-pills" class="nav nav-pills flex-nowrap overflow-auto pb-1 mb-3"></ul>

        <!-- Messages like "Loading..." or "No lines yet" appear here -->
        <div id="lines-message" class="text-muted">Loading lines...</div>

        <!-- d-none = hidden until there are lines to show -->
        <div id="lines-table" class="table-responsive d-none">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>Player</th>
                <th>Team</th>
                <th class="text-end">Line</th>
                <th class="text-end">Avg. This Season</th>
                <th class="text-end">Last 5 (L5)</th>
                <th class="text-end">Last 10 (L10)</th>
              </tr>
            </thead>
            <tbody id="lines-body"></tbody>
          </table>
        </div>

      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="api.js"></script>
  <script src="nav.js"></script>
  <script src="config.js"></script>
  <script src="game.js"></script>
</body>
</html>
