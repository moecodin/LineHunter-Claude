<!DOCTYPE html>
<!-- data-bs-theme="dark" = Bootstrap 5.3 dark mode for the whole page -->
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule · LineHunter</title>

  <!-- Google Fonts: Barlow Condensed (display), Inter (body), JetBrains Mono (labels) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS, loaded from a CDN (someone else's server), so there's nothing to install -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- OUR design. Loaded after Bootstrap so our rules win. -->
  <link href="styles.css" rel="stylesheet">
</head>

<body>

  <div id="site-nav"></div>

  <!-- container = centers the content and adds side padding -->
  <main class="container">

    <!-- GAMES HEADER: the title on the left, the date pager on the right.
         d-flex = line things up in a row. flex-wrap = drop to a new line on narrow screens.
         justify-content-between = push the two parts to opposite sides. gap-3 = space between. -->
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
      <div>
        <!-- lh-label = tiny techy caps text (styles.css) -->
        <div class="lh-label mb-1">NBA · <span class="text-accent">Schedule</span></div>
        <!-- lh-display = big condensed font. JavaScript changes the text inside the span. -->
        <h2 id="games" class="lh-display display-6 mb-0">Games <span id="games-date-label" class="text-accent">Today</span></h2>
      </div>

      <!-- DATE PAGER: Bootstrap's pagination component. JavaScript fills in the buttons.
           pagination-sm = the small size, so it fits on phones -->
      <nav aria-label="Choose a date">
        <ul id="date-pager" class="pagination pagination-sm mb-0"></ul>
      </nav>
    </div>

    <!-- row = a Bootstrap grid row. g-3 = gap between cards. mb-5 = space below.
         The id stays "games-list" so app.js can still find it. -->
    <div id="games-list" class="row g-3 mb-5">
      <div class="col-12 text-muted">Loading games...</div>
    </div>

    <!-- HIT RATES. Placeholder for now: real numbers need player stats. -->
    <div id="hit-rates" class="card mb-5">
      <div class="card-header lh-label py-3">Top Hit Rates</div>
      <div class="card-body">
        <!-- table-responsive = table scrolls sideways on small phones instead of breaking the layout -->
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>Player</th>
                <th>Team</th>
                <th>Prop</th>
                <th>Line</th>
                <th>Last 10</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td colspan="5" class="text-muted">
                  Coming soon, once we load real player stats.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </main>

  <!-- Bootstrap's JavaScript: makes interactive parts work (drawers, dropdowns, modals) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- ORDER MATTERS: api.js provides shared constants, nav.js injects the drawer, config.js defines the API key, then app.js uses them -->
  <script src="api.js"></script>
  <script src="nav.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
