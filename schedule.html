<!DOCTYPE html>
<!-- data-bs-theme="dark" = Bootstrap 5.3 dark mode for the whole page -->
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule · LineHunter</title>

  <!-- Google Fonts: Barlow Condensed (display), Inter (body), JetBrains Mono (labels) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=technor@400,600,700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS, loaded from a CDN (someone else's server), so there's nothing to install -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- OUR design. Loaded after Bootstrap so our rules win. -->
  <link href="styles.css" rel="stylesheet">
</head>

<body>

  <div id="site-nav"></div>

  <!-- container = centers the content and adds side padding -->
  <main class="container-fluid lh-container px-3 px-lg-4">

    <!-- GAMES HEADER: the title on the left, the date pager on the right.
         d-flex = line things up in a row. flex-wrap = drop to a new line on narrow screens.
         justify-content-between = push the two parts to opposite sides. gap-3 = space between. -->
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
      <div>
        <!-- lh-label = tiny techy caps text (styles.css) -->
        <div class="lh-label mb-1">NBA · <span class="text-accent">Schedule</span></div>
        <!-- lh-display = big condensed font. JavaScript changes the text inside the span. -->
        <h2 id="games" class="lh-display display-6 mb-0">Games <span id="games-date-label" class="text-accent">Today</span></h2>
      </div>

      <!-- DATE PAGER: the same underline tabs as the rest of the site (nav-underline + lh-tabs).
           app.js fills in the tabs. lh-date-tabs = a little tighter, so five days fit. -->
      <nav aria-label="Choose a date">
        <ul id="date-pager" class="nav nav-underline lh-tabs lh-date-tabs mb-0"></ul>
      </nav>
    </div>

    <!-- row = a Bootstrap grid row. g-3 = gap between cards. mb-5 = space below.
         The id stays "games-list" so app.js can still find it. -->
    <div id="games-list" class="row g-3 mb-5">
      <div class="col-12 text-muted">Loading games...</div>
    </div>

    <!-- Player search: nav.js puts the search bar here instead of in the navbar -->
    <div id="lh-search-slot" class="lh-search-slot mb-3"></div>

    <!-- TOP HIT RATES (left) and HIT LIST (right) for the picked day, side by side on desktop, stacked below.
         h-100 = both cards as tall as the row. js/top-hit-rates.js fills both when app.js loads the day's games. -->
    <div class="row g-4 mb-5">
      <div class="col-lg-6">
        <div id="top-hit-rates" class="card h-100 lh-top-compact">
          <div class="card-header d-flex justify-content-between align-items-center gap-2 py-3">
            <h2 class="lh-top-title mb-0"><i class="bi bi-lightning-charge-fill" aria-hidden="true"></i><span id="topHitRatesTitle">Top Hit Rates</span></h2>
            <span class="lh-label text-muted">L10 · Over</span>
          </div>
          <div class="card-body">
            <!-- Filter tabs: All / PTS / REB / AST / 3PM / PRA -->
            <ul id="topHitRatesPills" class="nav nav-underline lh-tabs mb-3" hidden></ul>
            <div id="topHitRatesList" class="text-muted">Loading hit rates...</div>
          </div>
        </div>
      </div>

      <div class="col-lg-6">
        <div id="hitlist" class="card h-100">
          <div class="card-header py-3">
            <h2 class="lh-top-title mb-1"><i class="bi bi-bullseye" aria-hidden="true"></i><span id="hitlistTitle">Hit List</span></h2>
            <div class="small text-muted">Props that hit in 100% of recent games</div>
          </div>
          <div class="card-body">
            <!-- A 2x2 grid of small cards, one per category. js/hit-list.js fills it in. -->
            <div id="hitlistBody" class="text-muted">Loading picks...</div>
          </div>
          <div class="card-footer small text-muted">Based on past results — not guarantees.</div>
        </div>
      </div>
    </div>

  </main>

  <!-- Bootstrap's JavaScript: makes interactive parts work (drawers, dropdowns, modals) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- ORDER MATTERS: api.js provides shared constants, nav.js injects the drawer, config.js defines the API key,
       js/stats.js + js/top-hit-rates.js provide the hit rates card, then app.js uses them all -->
  <script src="api.js"></script>
  <script src="nav.js"></script>
  <script src="config.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/share.js"></script>
  <script src="js/top-hit-rates.js"></script>
  <script src="js/hit-list.js"></script>
  <script src="app.js"></script>
</body>
</html>
