<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Theme: applied before anything renders, so there's no flash (default dark; js/components/nav.js has the toggle) -->
  <script>try { document.documentElement.setAttribute("data-bs-theme", localStorage.getItem("lh-theme") === "light" ? "light" : "dark"); } catch (error) { document.documentElement.setAttribute("data-bs-theme", "dark"); }</script>
  <meta name="robots" content="noindex"><!-- private soft launch: delete for the public launch -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NFL · LineHunter</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/lh-mark.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/lh-mark-32.png">
  <link rel="apple-touch-icon" href="assets/img/lh-mark-180.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=technor@400,600,700&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=comico@400&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="lh-nfl-page">
  <!-- Research mode: applied before anything renders, so there's no flash (js/components/nav.js has the switch) -->
  <script>try { if (localStorage.getItem("lh-mode") === "research") document.body.classList.add("research-mode"); } catch (error) { /* storage blocked: lines mode */ }</script>

  <div id="site-nav"></div>

  <!-- NFL "coming soon" page: the same layout, navbar, footer, theme toggle and styles as every other page. No team or league logos. -->
  <main class="container-fluid lh-container px-3 px-lg-4 my-4">
    <section class="card lh-nfl-card mx-auto mb-5">
      <div class="card-body text-center p-4 p-md-5">
        <div class="lh-nfl-icon" aria-hidden="true">🏈</div>
        <h1 class="lh-nfl-headline">Kickoff soon</h1>
        <p class="lh-nfl-sub">NFL stats and props are on the way.</p>

        <ul class="lh-nfl-list text-start">
          <li><i class="bi bi-graph-up-arrow" aria-hidden="true"></i><span><strong>Player prop hit rates</strong>How often players clear their lines, game by game.</span></li>
          <li><i class="bi bi-diagram-3" aria-hidden="true"></i><span><strong>Matchups</strong>How each defense stacks up against the player in front of it.</span></li>
          <li><i class="bi bi-bullseye" aria-hidden="true"></i><span><strong>A Hit List for game days</strong>The props that keep hitting, ready before kickoff.</span></li>
        </ul>

        <a href="schedule.html" class="btn btn-lh-primary mt-2">Back to NBA</a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/components/nav.js"></script>
</body>
</html>
