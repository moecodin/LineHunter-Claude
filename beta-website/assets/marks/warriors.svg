<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Bold front-facing Greek helmet over two crossed spears. Concept art for Golden State. -->
  <defs>
    <!-- T-shaped face opening: eye bar, nose guard, and a split down to the chin -->
    <path id="helmet" d="M100 40C126 40 146 60 150 92 153 112 150 130 142 146 134 162 124 176 112 190 111 170 112 150 120 132 124 122 132 116 137 108 124 101 112 101 105 105V134L100 143 95 134V105C88 101 76 101 63 108 68 116 76 122 80 132 88 150 89 170 88 190 76 176 66 162 58 146 50 130 47 112 50 92 54 60 74 40 100 40Z"/>
    <path id="cap" d="M90 42C90 28 110 28 110 42Z"/>
    <g id="spear">
      <path d="M0-128C9-114 9-100 0-86-9-100-9-114 0-128Z"/>
      <rect x="-4.5" y="-86" width="9" height="3" rx="1"/>
      <rect x="-4.5" y="-81" width="9" height="3" rx="1"/>
      <rect x="-4.5" y="-76" width="9" height="3" rx="1"/>
      <rect x="-2.75" y="-73" width="5.5" height="186" rx="2"/>
      <path d="M-4.5 108h9L0 122Z"/>
    </g>
    <mask id="behind-helmet" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
      <rect width="200" height="200" fill="#fff"/>
      <g transform="translate(100 103) scale(.74) translate(-100 -110)" fill="#000" stroke="#000" stroke-width="11">
        <use href="#helmet"/>
        <use href="#cap"/>
      </g>
    </mask>
    <!-- Center ridge running down the helmet -->
    <mask id="ridge" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
      <rect width="200" height="200" fill="#fff"/>
      <path d="M100 42V96" stroke="#000" stroke-width="2.6"/>
    </mask>
  </defs>

  <g fill="#fff" mask="url(#behind-helmet)">
    <use href="#spear" transform="translate(100 100) rotate(45)"/>
    <use href="#spear" transform="translate(100 100) rotate(-45)"/>
  </g>

  <g transform="translate(100 103) scale(.74) translate(-100 -110)" fill="#fff">
    <use href="#cap"/>
    <use href="#helmet" mask="url(#ridge)"/>
  </g>
</svg>
