# Netlify settings for LineHunter.
[build]
  publish = "."                     # the site is plain files in the project root
  functions = "netlify/functions"

# The site calls /api/bdl/v1/games?... ; Netlify runs the proxy function (netlify/functions/bdl.js), which adds the API key.
[[redirects]]
  from = "/api/bdl/*"
  to = "/.netlify/functions/bdl/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/bdl"
  to = "/.netlify/functions/bdl"
  status = 200
  force = true

[dev]
  framework = "#static"
  publish = "."

# ============================ PRIVATE SOFT LAUNCH ============================
# Password gate (HTTP Basic Auth) in front of the WHOLE site, including /api/bdl.
# Username and password: the SITE_USER and SITE_PASSWORD environment variables.
# FOR THE PUBLIC LAUNCH: delete this block (the next 3 lines), and optionally netlify/edge-functions/password-gate.js,
# the noindex meta tags and robots.txt.
[[edge_functions]]
  function = "password-gate"
  path = "/*"
# =============================================================================
